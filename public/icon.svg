<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="112" fill="url(#blueGrad)" filter="url(#shadow)"/>

  <!-- Subtle grid inner frame -->
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="#60a5fa" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Holes & Discs -->
  <!-- Row 1 -->
  <circle cx="120" cy="120" r="42" fill="#0f172a" opacity="0.6"/>
  <circle cx="210" cy="120" r="42" fill="url(#redGrad)"/>
  <circle cx="302" cy="120" r="42" fill="#0f172a" opacity="0.6"/>
  <circle cx="392" cy="120" r="42" fill="url(#yellowGrad)"/>

  <!-- Row 2 -->
  <circle cx="120" cy="210" r="42" fill="url(#yellowGrad)"/>
  <circle cx="210" cy="210" r="42" fill="url(#redGrad)"/>
  <circle cx="302" cy="210" r="42" fill="url(#yellowGrad)"/>
  <circle cx="392" cy="210" r="42" fill="#0f172a" opacity="0.6"/>

  <!-- Row 3 -->
  <circle cx="120" cy="302" r="42" fill="url(#redGrad)"/>
  <circle cx="210" cy="302" r="42" fill="url(#yellowGrad)"/>
  <circle cx="302" cy="302" r="42" fill="url(#redGrad)"/>
  <circle cx="392" cy="302" r="42" fill="url(#yellowGrad)"/>

  <!-- Row 4 Winning 4-in-a-row highlight (diagonal or horizontal) -->
  <circle cx="120" cy="392" r="42" fill="url(#redGrad)"/>
  <circle cx="210" cy="392" r="42" fill="url(#redGrad)"/>
  <circle cx="302" cy="392" r="42" fill="url(#redGrad)"/>
  <circle cx="392" cy="392" r="42" fill="url(#redGrad)"/>

  <!-- Winning green ring on the 4th row -->
  <circle cx="120" cy="392" r="45" fill="none" stroke="#10b981" stroke-width="6"/>
  <circle cx="210" cy="392" r="45" fill="none" stroke="#10b981" stroke-width="6"/>
  <circle cx="302" cy="392" r="45" fill="none" stroke="#10b981" stroke-width="6"/>
  <circle cx="392" cy="392" r="45" fill="none" stroke="#10b981" stroke-width="6"/>
</svg>
